  $('grid').innerHTML = src.map((f, i) => `<div><img src="${f}" style="object-position:${[50, 25, 75][i % 3]}% ${[35, 55, 70][(i >> 1) % 3]}%;transform:scale(${[1.4, 1.9, 1.15][(i + (i >> 2)) % 3]})"><span>${len[i]}</span></div>`).join(''); }

const KEY = new Set(['seven','couch','pxi','nowadays','giants','reggaeton','join','phone','twelve','sunday']);
const PHR = [[3,3,4],[3,4,3],[3,4,4],[2,3,2,4,4],[3,2,3,2],[2,2,5],[2,2,3],[2,2,2]];
const groups = [];
PHR.forEach((counts, li) => { const lw = W.filter((w) => w.line === li); let k = 0; counts.forEach((c) => { groups.push({ words: lw.slice(k, k + c), li }); k += c; }); });
groups.forEach((g, i) => { const last = g.words[g.words.length - 1]; g.s = g.words[0].s - 0.02; const nx = groups[i + 1]; g.e = nx ? Math.min(nx.words[0].s - 0.02, last.e + 0.7) : last.e + 1.6; });
const show = (w) => { const l = w.toLowerCase(); return l === 'pxi' ? 'PXI' : l === 'howston' ? 'Houston' : l === 'giants' ? 'Giants' : l === 'nowadays' ? 'Nowadays' : l === 'sunday' ? 'Sunday' : l === 'a.m.' ? 'am' : l; };

// phone camera: focus point (in phone space) lands on a target point, at scale s
const CARD = [481, 842], JOINP = [498, 1276];
function cam(s, P, Q) { return `translate(${Q[0] - s * P[0]}px,${Q[1] - s * P[1]}px) scale(${s})`; }
function mixCam(a, b, p) { return { s: lerp(a.s, b.s, p), P: [lerp(a.P[0], b.P[0], p), lerp(a.P[1], b.P[1], p)], Q: [lerp(a.Q[0], b.Q[0], p), lerp(a.Q[1], b.Q[1], p)] }; }
const NB = [540, 720]; // the notification, in phone space
const CL = { s: 1.55, P: [540, 760], Q: [540, 820] }, CN = { s: 1.75, P: NB, Q: [540, 760] }, C0 = { s: 1, P: [540, 898], Q: [540, 898] },
  CC = { s: 1.55, P: CARD, Q: [540, 700] }, CJ = { s: 1.7, P: [566, 1276], Q: [540, 780] }, CR = { s: 1.45, P: [540, 900], Q: [540, 880] };

let D = null;
window.render = function (t, pass) {
  document.body.classList.toggle('pass-ui', pass === 'ui');
  document.body.classList.toggle('pass-art', pass === 'art');
  if (!D) { try { D = $('disc').contentDocument; } catch (e) {} }
  const inn = (k) => t >= T[k][0] && t < T[k][1];
  $('turb').setAttribute('seed', Math.floor(t * 10) % 50 + 1);
  $('world').style.filter = STYLE === 'sketch' ? 'url(#boil)' : 'none';
  $('grain').style.backgroundPosition = `${(Math.floor(t * 12) * 37) % 200}px ${(Math.floor(t * 12) * 91) % 200}px`;
  $('map').style.display = inn('map') ? '' : 'none';
  const phoneOn = inn('hook') || inn('phone1') || inn('phone2') || inn('next');
  $('pwrap').style.display = phoneOn ? '' : 'none';

  /* PLATES: the character shots come from the 3D rig (studio/world3d), one PNG per frame at 24 a second */
  let plate = null, wait = true;
  if (inn('room')) plate = ['couch', Math.min(PL.couch - 1, Math.floor((t - T.room[0]) * 24))];
  if (inn('floor')) plate = ['floor', Math.min(PL.floor - 1, Math.floor((t - T.floor[0]) * 24))];
  const im = $('plate');
  if (plate) {
    const src = `plates/${plate[0]}/f${String(plate[1]).padStart(4, '0')}.png`;
    im.style.display = ''; im.style.transform = `scale(${inn('room') ? lerp(1, 4.2, eIO(pr(t, T.room[1] - 0.34, 0.34))) : 1})`;
    if (im.dataset.src !== src) { im.dataset.src = src; im.src = src; wait = im.decode().then(() => true, () => true); }
  } else im.style.display = 'none';
  $('grain').style.display = plate ? 'none' : '';
  /* MAP: one pin and one label at a time, each on the word that names it */
  if (inn('map')) {
    const hl = { K: T.map[0], R: K.giants, C: K.regg };
    const active = t >= hl.C - .05 ? 'C' : t >= hl.R - .05 ? 'R' : 'K';
    PINS.forEach((p, i) => {
      const pp = eBack(pr(t, T.map[0] + 0.25 + i * 0.05, 0.3));
      let sc = pp, op = pp > 0 ? 1 : 0;
      if (p[2] === active) sc = lerp(1, 1.55, eBack(pr(t, hl[active] - 0.03, 0.3))); else op *= p[2] === 'K' && active === 'K' ? 1 : 0.35;
      if (p[2] === 'K' && active === 'K') { sc = lerp(0, 1.55, eBack(pr(t, T.map[0], 0.3))); op = 1; }
      const g = $('pin' + i).firstChild; g.setAttribute('transform', `scale(${sc})`); g.style.opacity = op;
    });
    const ring = (t - T.map[0]) % 1.2;
    $('youRing').setAttribute('r', 26 + 44 * clamp(ring / 1.2)); $('youRing').style.opacity = 1 - clamp(ring / 1.2);
    $('you').setAttribute('transform', `translate(560,760) scale(${eBack(pr(t, T.map[0], 0.3))})`);
  }
  /* PHONE */
  if (phoneOn) {
    let lock = 0, home = 0, app = 0, roll = 0, C = C0;
    if (inn('hook')) { lock = 1; C = mixCam(CL, CN, eIO(pr(t, K.seven - 0.2, 0.45))); }
    if (inn('phone1')) {
      home = 1;
      const open = eOut(pr(t, K.pxi + 0.02, 0.32)); app = open > 0 ? 1 : 0;
      $('app').style.transform = `scale(${lerp(0.22, 1, open)})`; $('app').style.borderRadius = `${lerp(46, 0, open)}px`;
      C = mixCam(C0, CC, eIO(pr(t, K.there - 0.05, 0.45)));
    } else $('app').style.transform = 'none';
    if (inn('phone2')) { app = 1; C = mixCam(CC, CJ, eIO(pr(t, K.tap - 0.35, 0.4))); }
    if (inn('next')) {
      lock = t < ROLL + 0.3 ? 1 : 0; roll = t >= ROLL ? 1 : 0;
      C = t < ROLL ? mixCam(CL, CN, eIO(pr(t, K.next + 0.3, 0.45))) : mixCam(CN, CR, eOut(pr(t, ROLL, 0.35)));
      $('roll').style.transform = `translateX(${(1 - eOut(pr(t, ROLL, 0.3))) * 540}px)`;
      $('grid').style.transform = `translateY(${-lerp(0, 260, eIO(pr(t, ROLL + 0.4, T.next[1] - ROLL - 0.4)))}px)`;
    }
    $('pwrap').style.transform = cam(C.s, C.P, C.Q);
    $('lock').style.opacity = lock; $('home').style.opacity = home; $('app').style.opacity = app; $('roll').style.opacity = roll;
    // the notifications drop in on the word before the push
    const n0 = eOut(pr(t, K.your - 0.15, 0.3)), n1 = eOut(pr(t, K.next - 0.05, 0.3));
    $('nb0').style.opacity = inn('hook') ? n0 : 0; $('nb0').style.transform = `translateY(${(1 - n0) * -60}px)`;
    $('nb1').style.opacity = inn('next') ? n1 : 0; $('nb1').style.transform = `translateY(${(1 - n1) * -60}px)`;
    $('lclk').textContent = inn('next') ? '12:31' : '1:04'; $('ldt').textContent = inn('next') ? 'Sunday, December 6' : 'Sunday, November 29';
    if (D && D.getElementById('stage')) {
      const st = D.getElementById('stage'), det = D.getElementById('det'), join = D.getElementById('join');
      const vc = D.querySelector('.vc'); if (vc) vc.style.transform = `rotate(${t * 38}deg)`;
      let sx = 0, so = 1, dop = 1, spot = 0; // spot: the card is the subject, the rest of the screen dims
      if (inn('phone1')) { const c = eOut(pr(t, K.pxi + 0.5, 0.42)); sx = (1 - c) * 300; so = c; dop = eOut(pr(t, K.pxi + 0.7, 0.35)); spot = eIO(pr(t, K.there - 0.05, 0.45)); }
      if (inn('phone2')) spot = 1 - eIO(pr(t, K.tap - 0.35, 0.4));
      st.style.transform = `translateX(${sx}px)`; st.style.opacity = so; det.style.opacity = dop * lerp(1, 0.06, spot); D.querySelector('.act').style.opacity = lerp(1, 0.06, spot);
      const jt = K.join, pressed = t >= jt - 0.06 && t < jt + 0.1;
      join.style.transform = `scale(${pressed ? 0.92 : 1})`;
      const joined = inn('phone2') && t >= jt + 0.1;
      join.classList.toggle('done', joined); join.textContent = joined ? 'JOINED' : 'JOIN';
    }
    const taps = [[K.pxi - 0.05, 540, 716], [K.join - 0.06, JOINP[0], JOINP[1]]];
    let tp = null; taps.forEach((x) => { if (t >= x[0] && t < x[0] + 0.35) tp = x; });
    if (tp) { const p = pr(t, tp[0], 0.35); $('tap').setAttribute('cx', tp[1]); $('tap').setAttribute('cy', tp[2]); $('tap').setAttribute('r', 20 + 50 * eOut(p)); $('tap').style.opacity = 1 - p; } else $('tap').style.opacity = 0;
  }
  /* UI */
  const LB = [['labR', K.giants, K.regg], ['labC', K.regg, T.map[1]]]; // the party's own pin stays lit from the card; its label would flash for 0.15 s
  LB.forEach(([id, a, b]) => { const p = eOut(pr(t, a, 0.25)); const o = !inn('map') ? 0 : t < b - 0.05 ? p : 1 - pr(t, b - 0.05, 0.15); $(id).style.opacity = o; $(id).style.transform = `translateY(${(1 - p) * 20}px)`; });
  $('end').style.opacity = pr(t, T.end[0], 0.2);
  document.querySelector('#end .icon').style.transform = `scale(${eBack(pr(t, T.end[0], 0.35))})`;
  ['nm', 'free', 'badges'].forEach((c, i) => { document.querySelector('#end .' + c).style.opacity = pr(t, T.end[0] + 0.15 + i * 0.12, 0.2); });
  const g = groups.find((x) => t >= x.s && t < x.e);
  $('cap').innerHTML = !g ? '' : g.words.map((w) => { const v = t >= w.s - 0.03; const p = eBack(pr(t, w.s - 0.03, 0.12)); return `<span class="${KEY.has(w.w.toLowerCase()) ? 'k' : ''}" style="opacity:${v ? 1 : 0};transform:scale(${v ? lerp(.85, 1, p) : .85})">${show(w.w)}</span>`; }).join('');
  return wait;
};
window.ready = () => new Promise((res) => { const f = $('disc'); const go = () => { D = f.contentDocument; Promise.all([document.fonts.ready, D.fonts ? D.fonts.ready : 1]).then(() => setTimeout(res, 400)); }; if (f.contentDocument && f.contentDocument.readyState === 'complete') go(); else f.addEventListener('load', go); });
window.safeCheck = function (t) {
  window.render(t, 'all'); const bad = [];
  document.querySelectorAll('#cap span, .lab, #end .icon, #end .nm, #end .free, #end .badges').forEach((el) => {
    const cs = getComputedStyle(el); if (parseFloat(cs.opacity) < 0.05 || cs.display === 'none' || !el.textContent && !el.querySelector('img')) return;
    let op = 1, e = el; while (e && e !== document.body) { op *= parseFloat(getComputedStyle(e).opacity); e = e.parentElement; } if (op < 0.05) return;
    const rg = document.createRange(); rg.selectNodeContents(el); const r = rg.getBoundingClientRect(); if (r.width === 0) return;
    if (r.left < 88 || r.right > 932 || r.top < 360 || r.bottom > 1440) bad.push(`${t.toFixed(2)}s ${el.id || el.className || el.tagName} [${Math.round(r.left)},${Math.round(r.top)},${Math.round(r.right)},${Math.round(r.bottom)}]`);
  });
  return bad;
};
</script>
