<body>

<script src="words.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = (p) => 1 - Math.pow(1 - clamp(p), 3);
const eIO = (p) => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const eBack = (p) => { p = clamp(p); const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const pr = (t, a, d) => clamp((t - a) / d);
const W = VO.words;
const A = (line, w, n = 0) => { const m = W.filter((x) => x.line === line && x.w.toLowerCase() === w.toLowerCase()); if (!m[n]) throw new Error('no word ' + line + ' ' + w); return m[n].s; };
const STYLE = new URLSearchParams(location.search).get('style') || 'nio';
document.body.classList.add('st-' + STYLE);
// key times, all from the voice
const LN = VO.lines;
const K = { thirty: A(0, 'Thirty'), nobody: A(0, 'nobody'), so: A(2, 'So'), pxi: A(2, 'PXI'), turns: A(3, 'Turns'), karaoke: A(3, 'karaoke'), three: A(3, 'three'),
  rooftop: A(3, 'rooftop'), run: A(3, 'run'), tap: A(4, 'tap'), join: A(4, 'join'), send: A(4, 'send'), chat: A(4, 'chat'),
  now: A(5, 'Now'), every: A(5, "everybody's"), on: A(5, 'on'), way: A(5, 'way'), four: A(6, 'four') };
const T = { hook: [0, LN[1].s - 0.05], room: [LN[1].s - 0.05, K.pxi - 0.17], phone1: [K.pxi - 0.17, K.three - 0.03], map: [K.three - 0.03, LN[4].s + 0.05],
  phone2: [LN[4].s + 0.05, K.send + 0.3], chat2: [K.send + 0.3, LN[6].s - 0.1], kara: [LN[6].s - 0.1, LN[7].s + 0.02], end: [LN[7].s + 0.02, 99] };
const R1 = K.nobody - 0.3; // the rewind ends here
const PL = { room: 141, kara: 78 }; // frames in plates/<name>/, 24 a second, from the 3D rig
const DUR = VO.duration + 0.45;

{ let h = '';
  for (let i = -6; i < 16; i++) h += `<line class="street" x1="${-300 + i * 130}" y1="-200" x2="${-300 + i * 130 + 360}" y2="2100"/>`;
  for (let j = -2; j < 18; j++) h += `<line class="street" x1="-200" y1="${j * 125}" x2="1300" y2="${j * 125 - 230}"/>`;
  h += `<line class="street" x1="-100" y1="300" x2="1200" y2="1300" style="stroke-width:26px"/>`;
  $('streets').innerHTML = h; }
const PINS = [[200,470],[640,420],[930,640],[480,960],[860,880],[150,690],[700,640],[990,450],[380,640,'K'],[790,500,'R'],[300,880,'C'],[600,1000]];
$('pins').innerHTML = PINS.map((p, i) => `<g id="pin${i}" transform="translate(${p[0]},${p[1]})"><g><path class="pin s" d="M0,0 C-10,-22 -34,-40 -34,-62 A34,34 0 1 1 34,-62 C34,-40 10,-22 0,0 Z"/><circle cx="0" cy="-62" r="12" style="fill:#fff"/></g></g>`).join('');

const IDK = ['Sarah','Mike','Emily','me','Theo','Sarah','Mike','me','Emily','Theo','Sarah','me','Mike','Emily'];
const IDKTXT = ['idk','idk','idk lol','idk','idk','idk tbh','idk','idk','idkkk','idk','idk','idk','idk','idk'];
function msgHTML(m) {
  if (m.card) return `<div class="m me"><div class="card"><img src="/look/app-screens/assets/cover-karaoke.jpg"><div class="t">Karaoke night, 9:30</div><div class="u">pxi · 3 blocks away</div></div></div>`;
  const me = m.who === 'me';
  return `<div class="m ${me ? 'me' : ''}">${me ? '' : `<div class="who">${m.who}</div>`}<div class="b">${m.txt}</div></div>`;
}
let lastChat = '';
function setChat(list, pop) {
  const key = JSON.stringify(list) + '|' + (pop ?? 1).toFixed(2); if (key === lastChat) return; lastChat = key;
  $('list').innerHTML = '<div class="ts">Today 9:01 PM</div>' + list.map(msgHTML).join('');
  const kids = $('list').children;
  if (kids.length && pop !== undefined) { const k = kids[kids.length - 1]; const p = eBack(pop); k.style.transform = `translateY(${(1 - p) * 40}px) scale(${lerp(.6, 1, p)})`; k.style.opacity = clamp(pop * 3); k.style.transformOrigin = k.classList.contains('me') ? '100% 100%' : '0 100%'; }
}
const HIST = IDK.map((w, i) => ({ who: w, txt: IDKTXT[i] }));
const OMW = [{ who: 'Sarah', txt: 'omw' }, { who: 'Mike', txt: 'omw' }, { who: 'Emily', txt: 'omw!!' }, { who: 'Theo', txt: 'omw. not singing tho' }];
const FINAL = [...HIST, { card: 1, who: 'me' }, ...OMW];

const KEY = new Set(['pxi','karaoke','rooftop','run','club','join','way','four','tonight']);
// Captions: the groups come from the voice (the " / " breaks in script.md's voice block, studio/voice.py). Nothing to count here.
const groups = [];
VO.lines.forEach((l) => l.groups.forEach((_, g) => groups.push({ words: W.filter((w) => w.line === l.i && w.g === g) })));
groups.forEach((g, i) => { const last = g.words[g.words.length - 1]; g.s = g.words[0].s - 0.02; const nx = groups[i + 1]; g.e = nx ? Math.min(nx.words[0].s - 0.02, last.e + 0.7) : last.e + 1.6; });
const show = (w) => { const l = w.toLowerCase(); return l === 'pxi' ? 'PXI' : l === 'nio' ? 'Nio' : l === 'friday' ? 'Friday' : l === 'a.m.' ? 'am' : l; };

// The phone camera. The phone is drawn 1080x1920 ("phone space", #pwrap); the app screen inside it is the 390x844
// Discover page scaled 1.37949, so an app pixel (x, y) is at about (271 + 1.379x, 367 + 1.379y) in phone space.
// A camera { s, P, Q } puts phone-space point P at frame point Q, at scale s. To aim at a new part of the screen,
// take a still of the whole phone (camera C0), read the pixel you want, and use it as P.
// CARD: the middle of the event card. JOINP, SHAREP: the middles of the JOIN and share buttons (the taps land there).
const CARD = [481, 842], JOINP = [498, 1276], SHAREP = [634, 1276];
function cam(s, P, Q) { return `translate(${Q[0] - s * P[0]}px,${Q[1] - s * P[1]}px) scale(${s})`; }
function mixCam(a, b, p) { return { s: lerp(a.s, b.s, p), P: [lerp(a.P[0], b.P[0], p), lerp(a.P[1], b.P[1], p)], Q: [lerp(a.Q[0], b.Q[0], p), lerp(a.Q[1], b.Q[1], p)] }; }
const CH = { s: 1.5, P: [540, 1114], Q: [540, 1130] }, C0 = { s: 1, P: [540, 898], Q: [540, 898] }, CC = { s: 1.55, P: CARD, Q: [540, 700] }, CJ = { s: 1.7, P: [566, 1276], Q: [540, 780] };

let D = null;
window.render = function (t, pass) {
  document.body.classList.toggle('pass-ui', pass === 'ui');
  document.body.classList.toggle('pass-art', pass === 'art');
  if (!D) { try { D = $('disc').contentDocument; } catch (e) {} }
  const inn = (k) => t >= T[k][0] && t < T[k][1];
  $('turb').setAttribute('seed', Math.floor(t * 10) % 50 + 1);
  $('world').style.filter = STYLE === 'sketch' ? 'url(#boil)' : 'none';
  $('grain').style.backgroundPosition = `${(Math.floor(t * 12) * 37) % 200}px ${(Math.floor(t * 12) * 91) % 200}px`;
  $('map').style.display = inn('map') ? '' : 'none';
  const phoneOn = inn('hook') || inn('phone1') || inn('phone2') || inn('chat2');
  $('pwrap').style.display = phoneOn ? '' : 'none';

  /* PLATES: the character shots come from the 3D rig (studio/world3d), one PNG per frame at 24 a second */
  let plate = null, wait = true;
  if (inn('room')) plate = ['room', Math.min(PL.room - 1, Math.floor((t - T.room[0]) * 24))];
  if (inn('kara')) plate = ['kara', Math.min(PL.kara - 1, Math.floor((t - T.kara[0]) * 24))];
  const im = $('plate');
  if (plate) {
    const src = `plates/${plate[0]}/f${String(plate[1]).padStart(4, '0')}.png`;
    im.style.display = ''; im.style.transform = `scale(${inn('room') ? lerp(1, 4.2, eIO(pr(t, T.room[1] - 0.34, 0.34))) : 1})`;
    if (im.dataset.src !== src) { im.dataset.src = src; im.src = src; wait = im.decode().then(() => true, () => true); }
  } else im.style.display = 'none';
  $('grain').style.display = plate ? 'none' : '';
  /* MAP */
  if (inn('map')) {
    const hl = { K: T.map[0], R: K.rooftop, C: K.run };
    const active = t >= hl.C - .05 ? 'C' : t >= hl.R - .05 ? 'R' : 'K';
    PINS.forEach((p, i) => {
      const pp = eBack(pr(t, T.map[0] + 0.25 + i * 0.05, 0.3));
      let sc = pp, op = pp > 0 ? 1 : 0;
      if (p[2] === active) sc = lerp(1, 1.55, eBack(pr(t, hl[active] - 0.03, 0.3))); else op *= p[2] === 'K' && active === 'K' ? 1 : 0.35;
      if (p[2] === 'K' && active === 'K') { sc = lerp(0, 1.55, eBack(pr(t, T.map[0], 0.3))); op = 1; }
      const g = $('pin' + i).firstChild; g.setAttribute('transform', `scale(${sc})`); g.style.opacity = op;
    });
    const ring = (t - T.map[0]) % 1.2;
    $('youRing').setAttribute('r', 26 + 44 * clamp(ring / 1.2)); $('youRing').style.opacity = 1 - clamp(ring / 1.2);
    // "for some reason": his little head shakes no at a 7 am run club
    $('you').setAttribute('transform', `translate(560,760) scale(${eBack(pr(t, T.map[0], 0.3))})`);
  }
  /* PHONE */
  if (phoneOn) {
    let home = 0, app = 0, chat = 0, C = C0;
    if (inn('hook')) { chat = 1; C = CH; }
    if (inn('phone1')) {
      home = 1;
      const open = eOut(pr(t, K.pxi + 0.02, 0.32)); app = open > 0 ? 1 : 0;
      $('app').style.transform = `scale(${lerp(0.22, 1, open)})`; $('app').style.borderRadius = `${lerp(46, 0, open)}px`;
      C = mixCam(C0, CC, eIO(pr(t, K.turns - 0.05, 0.45)));
    } else $('app').style.transform = 'none';
    if (inn('phone2')) { app = 1; C = mixCam(CC, CJ, eIO(pr(t, K.tap - 0.35, 0.4))); }
    if (inn('chat2')) { chat = 1; const p = eOut(pr(t, T.chat2[0], 0.3)); C = mixCam(CJ, CH, p); app = t < T.chat2[0] + 0.3 ? 1 : 0; }
    $('pwrap').style.transform = cam(C.s, C.P, C.Q);
    $('home').style.opacity = home; $('app').style.opacity = app; $('chat').style.opacity = chat;
    $('chat').style.transform = inn('chat2') && t < T.chat2[0] + 0.3 ? `translateX(${(1 - eOut(pr(t, T.chat2[0], 0.3))) * 540}px)` : 'none';
    if (D && D.getElementById('stage')) {
      const st = D.getElementById('stage'), det = D.getElementById('det'), join = D.getElementById('join');
      const vc = D.querySelector('.vc'); if (vc) vc.style.transform = `rotate(${t * 38}deg)`;
      let sx = 0, so = 1, dop = 1, spot = 0; // spot: the card is the subject, the rest of the screen dims
      if (inn('phone1')) { const c = eOut(pr(t, K.pxi + 0.5, 0.42)); sx = (1 - c) * 300; so = c; dop = eOut(pr(t, K.pxi + 0.7, 0.35)); spot = eIO(pr(t, K.turns - 0.05, 0.45)); }
      if (inn('phone2')) spot = 1 - eIO(pr(t, K.tap - 0.35, 0.4));
      st.style.transform = `translateX(${sx}px)`; st.style.opacity = so; det.style.opacity = dop * lerp(1, 0.06, spot); D.querySelector('.act').style.opacity = lerp(1, 0.06, spot);
      const jt = K.join, pressed = t >= jt - 0.06 && t < jt + 0.1;
      join.style.transform = `scale(${pressed ? 0.92 : 1})`;
      const joined = (inn('phone2') || inn('chat2')) && t >= jt + 0.1;
      join.classList.toggle('done', joined); join.textContent = joined ? 'JOINED' : 'JOIN';
    }
    if (inn('hook')) {
      const r1 = R1, p0 = K.nobody;
      if (t < K.thirty) setChat(FINAL.slice(-9));
      else if (t < r1) { const n = FINAL.length, k = Math.floor(Math.pow(pr(t, K.thirty, r1 - K.thirty), 0.7) * n); setChat(FINAL.slice(0, n - k).slice(-9)); }
      else if (t < p0) setChat([]);
      else { const k = clamp(Math.floor((t - p0) / 0.1) + 1, 0, 14); const frac = ((t - p0) / 0.1) % 1; setChat(HIST.slice(0, k).slice(-9), k < 14 ? clamp(frac * 1.6) : 1); }
    }
    if (inn('chat2')) {
      const cp = K.chat - 0.15, omwT = [K.now, K.every, K.on, K.way];
      let list = [...HIST], pop;
      if (t >= cp) { list.push({ card: 1, who: 'me' }); pop = pr(t, cp, 0.3); }
      omwT.forEach((ot, i) => { if (t >= ot - 0.05) { list.push(OMW[i]); pop = pr(t, ot - 0.05, 0.25); } });
      setChat(list.slice(-8), pop);
    }
    const taps = [[K.pxi - 0.05, 540, 716], [K.join - 0.06, JOINP[0], JOINP[1]], [K.send - 0.04, SHAREP[0], SHAREP[1]]];
    let tp = null; taps.forEach((x) => { if (t >= x[0] && t < x[0] + 0.35) tp = x; });
    if (tp) { const p = pr(t, tp[0], 0.35); $('tap').setAttribute('cx', tp[1]); $('tap').setAttribute('cy', tp[2]); $('tap').setAttribute('r', 20 + 50 * eOut(p)); $('tap').style.opacity = 1 - p; } else $('tap').style.opacity = 0;
  }
  /* UI */
  const rw = t >= K.thirty - 0.05 && t < R1, play = t >= R1 && t < R1 + 0.5, tr2 = t >= T.hook[1] - 0.55 && t < T.hook[1];
  $('hud').style.opacity = rw || play ? 1 : 0;
  $('hudg').textContent = play ? '▶' : '◀◀';
  const mins = Math.round(lerp(31, 1, clamp(pr(t, K.thirty, R1 - K.thirty))));
  $('hudt').textContent = `FRI 9:${String(mins).padStart(2, '0')} PM`;
  $('scan').style.opacity = rw || tr2 ? 1 : 0;
  [0, 1, 2].forEach((i) => { const e = $('trk' + i); e.style.opacity = rw || tr2 ? .6 : 0; e.style.top = `${((Math.floor(t * 24) * (173 + i * 311)) % 1920)}px`; });
  const LB = [['labK', T.map[0], K.rooftop], ['labR', K.rooftop, K.run], ['labC', K.run, T.map[1]]];
  LB.forEach(([id, a, b]) => { const p = eOut(pr(t, a, 0.25)); const o = !inn('map') ? 0 : t < b - 0.05 ? p : 1 - pr(t, b - 0.05, 0.15); $(id).style.opacity = o; $(id).style.transform = `translateY(${(1 - p) * 20}px)`; });
  const BT = [A(1, "Everyone's") - 0.05, A(1, 'someone') - 0.05, A(1, 'pick') - 0.15, K.so - 0.05];
  [0, 1, 2].forEach((i) => { const b = $('ban' + i), a = eOut(pr(t, BT[i], 0.22)), o = 1 - pr(t, BT[i + 1] - 0.02, 0.16); b.style.opacity = inn('room') ? Math.min(a, o) : 0; b.style.transform = `translateY(${(1 - a) * -46}px)`; });
  { const a = pr(t, T.kara[0] + 0.12, 0.28); $('rcpt').style.opacity = inn('kara') ? clamp(a * 3) : 0; $('rcpt').style.transform = `scale(${lerp(.6, 1, eBack(a))})`; }
  $('end').style.opacity = pr(t, T.end[0], 0.2);
  document.querySelector('#end .icon').style.transform = `scale(${eBack(pr(t, T.end[0], 0.35))})`;
  const card2 = pr(t, T.end[0] + 0.15, 0.25);
  ['nm', 'free', 'badges'].forEach((c, i) => { document.querySelector('#end .' + c).style.opacity = pr(t, T.end[0] + 0.15 + i * 0.12, 0.2); });
  const g = groups.find((x) => t >= x.s && t < x.e);
  $('cap').innerHTML = !g ? '' : g.words.map((w) => { const v = t >= w.s - 0.03; const p = eBack(pr(t, w.s - 0.03, 0.12)); return `<span class="${KEY.has(w.w.toLowerCase()) ? 'k' : ''}" style="opacity:${v ? 1 : 0};transform:scale(${v ? lerp(.85, 1, p) : .85})">${show(w.w)}</span>`; }).join('');
  return wait;
};
window.ready = () => new Promise((res) => { const f = $('disc'); const go = () => { D = f.contentDocument; Promise.all([document.fonts.ready, D.fonts ? D.fonts.ready : 1]).then(() => setTimeout(res, 400)); }; if (f.contentDocument && f.contentDocument.readyState === 'complete') go(); else f.addEventListener('load', go); });
</script>
