<!doctype html>
<html><head><meta charset="utf-8">
<!-- PXI Discover, the All events list, rebuilt for the web from pxi-mobile-app (src/components/discover/allEvents/:
     AllEventsRows.tsx, AllEventsView.tsx, allEventsModel.ts, PosterFallback.tsx; DiscoverScreen.tsx, DiscoverFilterBar.tsx
     and when/ViewSwitch.tsx for what it sits under). 390x844pt iPhone, insets 47/34.
     The state drawn: the list as a view of its own (Cards / All events), which the app shows when the native map is not
     in the build or could not start. With the map, the same rows stand in a grey sheet over it; the map is not rebuilt.
     Seed: studio/list.py writes it (the app's own code orders, groups and words the rows). window.SEED, or ?seed=<file or JSON>.
     A scene drives it with window.scrollList(y), window.rowY(id) and window.press(id, p). -->
<style>
@font-face{font-family:Inter;src:url(assets/inter.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:'Stack Sans Notch';src:url(assets/StackSansNotch-Bold.ttf);font-weight:700 900}
:root{--page:#000;--sheet:#1C1C1C;--pill:#232323;--input:#2E2E2E;--purple:#A523EF;--dim:rgba(255,255,255,.55);--dimmer:rgba(255,255,255,.35);--hl:.3333px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;background:#000;overflow:hidden;-webkit-font-smoothing:antialiased}
body{font-family:Inter,-apple-system,system-ui,'Noto Color Emoji',sans-serif;color:#fff;position:relative}
.disp{font-family:'Stack Sans Notch',Inter,sans-serif;font-weight:900;letter-spacing:-.4px}
.abs{position:absolute}
.tab{font-variant-numeric:tabular-nums}
/* status bar (the phone's own) */
.sb{top:0;left:0;right:0;height:47px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 9px 38px;font-weight:600;font-size:17px;z-index:5}
/* DiscoverScreen header: paddingTop insets.top + 12, a 44 row, the title centred, the Create pill (42) at the right */
.hdr{top:59px;left:16px;right:16px;height:44px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.hdr img{width:42px;height:42px;border-radius:21px;object-fit:cover}
.hdr .mid{position:absolute;left:0;right:0;top:3px;display:flex;justify-content:center;align-items:flex-start;pointer-events:none}
.hdr .t{font-size:33px;line-height:38px;letter-spacing:-1.22px}
.create{width:42px;height:42px;border-radius:21px;background:var(--purple);display:flex;align-items:center;justify-content:center}
/* DiscoverFilterBar: pill 56 high, 8 from each edge; chipsRow paddingLeft 18, paddingRight 8 */
.fb{top:115px;left:8px;right:8px;height:56px;border-radius:28px;background:var(--pill);display:flex;align-items:center;padding-left:18px;padding-right:8px;overflow:hidden;z-index:5}
.grp{display:flex;align-items:center;height:100%;flex-shrink:0}
.small{color:var(--dimmer);font-size:14px;font-weight:700}
.val{font-size:20px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;margin-left:18px}
.chev{margin-left:2px;display:flex}
.ggap{width:32px;flex-shrink:0}
.spacer{flex:1;min-width:0}
.div{width:calc(var(--hl)*2);height:26px;margin-left:6px;background:rgba(255,255,255,.22);flex-shrink:0}
.ib{width:44px;height:56px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.sdot{position:absolute;left:30px;top:12px;width:8px;height:8px;border-radius:4px;background:var(--purple)}
/* ViewSwitch: row 44 (paddingTop 10, 8 each side), two words on one hairline, the purple line under the view on screen */
.vs{top:181px;left:8px;right:8px;height:34px;display:flex;border-bottom:var(--hl) solid rgba(255,255,255,.16);z-index:5}
.vs>div{flex:1;display:flex;justify-content:center;align-items:flex-end}
.vs span{position:relative;height:34px;display:flex;align-items:center;font-size:15px;font-weight:800;letter-spacing:-.1px}
.vs .on span:after{content:"";position:absolute;left:0;right:0;bottom:calc(var(--hl)*-1);height:2.5px;background:#A523EF}
.vs .off{color:var(--dim)}
/* AllEventsView styles.list: top topReserve + 8 (215 + 8), bottom 0; the page under the header is the page's black */
#list{top:223px;left:0;right:0;bottom:0;overflow-y:scroll;scrollbar-width:none}
#list::-webkit-scrollbar{display:none}
/* NightHeader: 56 high, pinned while its night is on screen, solid in the page's colour */
.nh{position:sticky;top:0;z-index:2;height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:var(--page)}
.nh .t{font-size:28px;line-height:34px;letter-spacing:-.8px;flex-shrink:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nh .c{color:var(--dimmer);font-size:16px;font-weight:700;margin-left:12px}
/* ListingRow: 96 high, 16 each side, 8 above and below, gap 12 */
.row{height:96px;padding:8px 16px;display:flex;align-items:flex-start;gap:12px;transform-origin:50% 50%}
.fly{position:relative;width:60px;height:80px;flex-shrink:0}
.fly img.c{width:60px;height:80px;border-radius:10px;object-fit:cover;background:#141414;display:block}
.fly .none{width:60px;height:80px;border-radius:10px;background:#141414}
.play{position:absolute;right:4px;bottom:4px;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.62);border:var(--hl) solid rgba(255,255,255,.35)}
.bd{flex:1;min-width:0;height:80px;display:flex;flex-direction:column;justify-content:space-between}
.bd .top{display:flex;flex-direction:column;gap:3px}
.ti{font-size:15.5px;line-height:19px;font-weight:800;letter-spacing:-.2px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.ve{color:var(--dim);font-size:13px;line-height:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh{display:flex;align-items:baseline;gap:10px}
.tm{color:var(--dim);font-size:13px;line-height:15.5px;font-weight:600;flex-shrink:0;white-space:nowrap}
.se{color:var(--dimmer);font-size:12px;line-height:14.5px;font-weight:600;flex-shrink:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd{width:76px;height:80px;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sd>div{white-space:nowrap}
.pr{max-width:76px;overflow:hidden;text-overflow:ellipsis}
.pr{font-size:14.5px;line-height:17.5px;font-weight:800;letter-spacing:-.1px}
.so{color:var(--dimmer);font-size:10.5px;line-height:12.5px;font-weight:800;letter-spacing:.9px}
/* PosterFallback, as a thumbnail: flat ink, the title in the display face, one rule, the paper grain over it */
.po{position:relative;width:60px;height:80px;border-radius:10px;overflow:hidden}
.po .l{position:absolute;color:#F4EFE6;white-space:nowrap;overflow:hidden}
.po .r{position:absolute;background:#F4EFE6;opacity:.9}
.po .g{position:absolute;inset:0;background:url('assets/poster-grain@3x.png') 0 0/128px 128px repeat}
/* MoreRow: 56 high, 16 each side, 6 above and below; the button 44 high, radius 14, a step lighter than the page */
.mw{height:56px;padding:6px 16px;display:flex;flex-direction:column;justify-content:center}
.mo{height:44px;border-radius:14px;background:var(--pill);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14.5px;font-weight:800;letter-spacing:-.1px}
/* the floating tab bar (the app's, as in discover.html) */
.tb{left:81px;bottom:24px;width:228px;height:64px;border-radius:32px;background:rgba(26,26,26,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;z-index:6}
.tb .slot{width:76px;display:flex;align-items:center;justify-content:center}
</style></head>
<body>
<div class="abs sb"><span id="clock">9:41</span>
  <span style="display:flex;gap:6px;align-items:center">
  <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
  <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 11.5l2.3-2.7a3.6 3.6 0 0 0-4.6 0z M3.9 6.6a6.4 6.4 0 0 1 8.2 0l1.6-1.8a8.8 8.8 0 0 0-11.4 0z M.5 3.2a11.4 11.4 0 0 1 15 0L17 1.4A13.7 13.7 0 0 0-1 1.4z"/></svg>
  <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2" fill="#fff"/><rect x="23.5" y="4" width="1.5" height="4" rx=".7" fill="#fff" fill-opacity=".4"/></svg></span></div>

<div class="abs hdr"><img id="me" src="assets/me-nio.png"><div class="mid"><span class="t disp">Discover</span><svg style="margin:12px 0 0 8px" width="14" height="14" viewBox="0 0 24 24"><path d="M18 9l-6 6-6-6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="create" id="create"></div></div>

<div class="abs fb" id="fb">
  <div class="grp"><span class="small">at</span><span class="val" id="when">This week</span><span class="chev" data-i="ArrowDown01Icon:14:dim"></span></div>
  <div class="ggap" id="ggap"></div>
  <div class="grp"><span class="small">in</span><span class="val" id="city">Los Angeles</span><span class="chev" data-i="ArrowDown01Icon:14:dim"></span></div>
  <div class="spacer"></div><div class="div"></div>
  <div class="ib"><span data-i="Sorting01Icon:22:#fff"></span><div class="sdot" id="sdot" style="display:none"></div></div>
  <div class="ib"><span data-i="Search01Icon:22:#fff"></span></div>
</div>

<div class="abs vs"><div class="off"><span>Cards</span></div><div class="on"><span>All events</span></div></div>

<div class="abs" id="list"></div>

<div class="abs tb">
  <div class="slot"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11.5L12 4l9 7.5"/><path d="M5 10v8.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V10"/><path d="M10 20v-4.5a2 2 0 0 1 4 0V20"/></svg></div>
  <div class="slot" style="opacity:.4"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
  <div class="slot" style="opacity:.4"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a3 3 0 0 0 0 6v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a3 3 0 0 0 0-6z"/><path d="M14 5v2.5M14 10.5v3M14 16.5V19"/></svg></div>
</div>

<script src="icons.js"></script>
<script>
// ---- seed ----
const seedParam = new URLSearchParams(location.search).get('seed');
const readSeed = (v) => { if (v.trim().startsWith('{')) return JSON.parse(v);
  const x = new XMLHttpRequest(); x.open('GET', new URL(v, parent !== window ? parent.location.href : location.href).href, false); x.send();
  if (x.status !== 200) throw new Error('no seed file ' + v); return JSON.parse(x.responseText); };
const S = window.SEED || (seedParam ? readSeed(seedParam) : null);
if (!S) throw new Error('all-events.html needs a seed: python3 studio/list.py <events folder>');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('clock').textContent = S.clock; $('when').textContent = S.when; $('city').textContent = S.city; if (S.me) $('me').src = S.me;
if (S.sortDotted) $('sdot').style.display = '';
$('create').innerHTML = hugeicon('PlusSignIcon', 20, '#fff', 2.6);
document.querySelectorAll('[data-i]').forEach((el) => { const [n, s, c] = el.dataset.i.split(':'); el.innerHTML = hugeicon(n, +s, c === 'dim' ? 'rgba(255,255,255,.55)' : c); });

// ---- the rows (AllEventsRows.tsx) ----
function poster(p) { // PosterFallback: every title line its own box, placed by posterLayout
  const t = p.title;
  return `<div class="po" style="background:${p.ink}">${t.lines.map((l) => `<div class="l disp" style="left:${l.left}px;top:${l.top}px;width:${l.width}px;height:${t.box}px;font-size:${t.size}px;line-height:${t.box}px;letter-spacing:${t.tracking}px">${esc(l.text)}</div>`).join('')}
    <div class="r" style="left:${p.rule.left}px;top:${p.rule.top}px;width:${p.rule.width}px;height:${p.rule.height}px"></div><div class="g"></div></div>`;
}
function listing(r) {
  return `<div class="row" data-id="${r.id}"><div class="fly">${r.poster ? poster(r.poster) : r.cover ? `<img class="c" src="${r.cover}">` : '<div class="none"></div>'}
      ${r.play ? `<div class="play">${hugeicon('PlayIcon', 13, '#fff', 2, '#fff')}</div>` : ''}</div>
    <div class="bd"><div class="top"><div class="ti">${esc(r.title)}</div>${r.venue ? `<div class="ve">${esc(r.venue)}</div>` : ''}</div>
      <div class="wh"><div class="tm tab">${esc(r.time)}</div>${r.series ? `<div class="se">${esc(r.series)}</div>` : ''}</div></div>
    <div class="sd">${r.price ? `<div class="pr tab">${esc(r.price)}</div>` : ''}<div class="so">${esc(r.tag)}</div></div></div>`;
}
const more = (r) => `<div class="mw"><div class="mo"><span>${esc(r.label)}</span>${hugeicon('ArrowDown01Icon', 16, 'rgba(255,255,255,.55)', 2.4)}</div></div>`;
const list = $('list');
// One block per night, so its header stays pinned exactly while its night is on screen (SectionList's sticky headers).
list.innerHTML = S.sections.map((s) => `<section><div class="nh"><div class="t disp">${esc(s.title)}</div><div class="c tab">${s.count}</div></div>${s.rows.map((r) => (r.kind === 'more' ? more(r) : listing(r))).join('')}</section>`).join('')
  + '<div style="height:98px"></div>'; // contentContainerStyle paddingBottom: listBottom (the tab bar's reserve)

// ---- what a scene can do ----
const maxScroll = () => Math.max(0, list.scrollHeight - list.clientHeight);
window.scrollList = (y) => { list.scrollTop = Math.max(0, Math.min(maxScroll(), y)); return list.scrollTop; };
window.maxScroll = maxScroll;
// Where to scroll so a listing stands `under` points below the top of the list (default: one row under the pinned header).
const rowOf = (id) => list.querySelector(`.row[data-id="${id}"]`);
window.rowY = (id, under = 56 + 96) => { const el = rowOf(id); if (!el) return null; return Math.max(0, Math.min(maxScroll(), el.offsetTop - under)); };
// A press on a row, 0 to 1: PressRow dips to 98.5% (SPRINGS.press), and nothing else changes.
window.press = (id, p) => { const el = rowOf(id); if (el) el.style.transform = `scale(${1 - 0.015 * Math.max(0, Math.min(1, p))})`; };

// ---- the filter bar's two values (DiscoverFilterBar.tsx): the gap between the groups gives first (32 down to 10),
// then the values shrink together on one line, down to 55%, before they are cut.
function fitBar() {
  const fb = $('fb'), w = $('when'), c = $('city'), gap = $('ggap');
  const inner = fb.clientWidth - 18 - 8; let fixed = 0;
  fb.querySelectorAll('.small,.chev,.div,.ib').forEach((el) => { const cs = getComputedStyle(el); fixed += el.getBoundingClientRect().width + parseFloat(cs.marginLeft); });
  fixed += 18 * 2; // LABEL_GAP before each value
  const nat = w.scrollWidth + c.scrollWidth; let over = fixed + nat + 32 - inner;
  if (over <= 0) return;
  gap.style.width = Math.max(10, 32 - over) + 'px'; over -= 22;
  if (over <= 0) return;
  const k = Math.max(0.55, (nat - over) / nat);
  [w, c].forEach((el) => { el.style.fontSize = 20 * k + 'px'; el.style.letterSpacing = -0.4 * k + 'px'; });
  if (k === 0.55) [w, c].forEach((el) => { el.style.overflow = 'hidden'; el.style.textOverflow = 'ellipsis'; el.style.minWidth = '0'; el.parentElement.style.flexShrink = '1'; el.parentElement.style.minWidth = '0'; });
}
// A title line the browser sets wider than the app's own measure shrinks, as adjustsFontSizeToFit does (to 60%).
function fitPosters() { document.querySelectorAll('.po .l').forEach((el) => { const fs0 = parseFloat(el.style.fontSize); let fs = fs0; while (el.scrollWidth > el.clientWidth + 0.5 && fs > fs0 * 0.6) { fs -= 0.25; el.style.fontSize = fs + 'px'; } }); }
document.fonts.ready.then(() => { fitBar(); fitPosters(); window.scrollList(S.scrollY || 0); document.body.dataset.ready = '1'; });
</script>
</body></html>
