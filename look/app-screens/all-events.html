<!doctype html>
<html><head><meta charset="utf-8">
<!-- PXI Discover, the All events list, rebuilt for the web from pxi-mobile-app (src/components/discover/allEvents/:
     AllEventsRows.tsx, AllEventsView.tsx, allEventsModel.ts, PosterFallback.tsx; DiscoverScreen.tsx, DiscoverFilterBar.tsx
     and when/ViewSwitch.tsx for what it sits under). 390x844pt iPhone, insets 47/34.
     The state drawn: the list as a view of its own (Cards / All events), which the app shows when the native map is not
     in the build or could not start. With the map, the same rows stand in a grey sheet over it; the map is not rebuilt.
     Seed: studio/list.py writes it (the app's own code orders, groups and words the rows). window.SEED, or ?seed=<file or JSON>.
     A scene drives it with window.scrollList(y), window.rowY(id) and window.press(id, p). -->
<style>
/* AllEventsView styles.list: top topReserve + 8 (215 + 8), bottom 0; the page under the header is the page's black */
#list{top:223px;left:0;right:0;bottom:0;overflow-y:scroll;scrollbar-width:none}
#list::-webkit-scrollbar{display:none}
/* NightHeader: 56 high, pinned while its night is on screen, solid in the page's colour */
.nh{position:sticky;top:0;z-index:2;height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:var(--page)}
.nh .t{font-size:28px;line-height:34px;letter-spacing:-.8px;flex-shrink:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nh .c{color:var(--dimmer);font-size:16px;font-weight:700;margin-left:12px}
/* ListingRow: 96 high, 16 each side, 8 above and below, gap 12 */
.row{height:96px;padding:8px 16px;display:flex;align-items:flex-start;gap:12px;transform-origin:50% 50%}
.fly{position:relative;width:60px;height:80px;flex-shrink:0}
.fly img.c{width:60px;height:80px;border-radius:10px;object-fit:cover;background:#141414;display:block}
.fly .none{width:60px;height:80px;border-radius:10px;background:#141414}
.play{position:absolute;right:4px;bottom:4px;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.62);border:var(--hl) solid rgba(255,255,255,.35)}
.bd{flex:1;min-width:0;height:80px;display:flex;flex-direction:column;justify-content:space-between}
.bd .top{display:flex;flex-direction:column;gap:3px}
.ti{font-size:15.5px;line-height:19px;font-weight:800;letter-spacing:-.2px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.ve{color:var(--dim);font-size:13px;line-height:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh{display:flex;align-items:baseline;gap:10px}
.tm{color:var(--dim);font-size:13px;line-height:15.5px;font-weight:600;flex-shrink:0;white-space:nowrap}
.se{color:var(--dimmer);font-size:12px;line-height:14.5px;font-weight:600;flex-shrink:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd{width:76px;height:80px;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sd>div{white-space:nowrap}
.pr{max-width:76px;overflow:hidden;text-overflow:ellipsis}
.pr{font-size:14.5px;line-height:17.5px;font-weight:800;letter-spacing:-.1px}
.so{color:var(--dimmer);font-size:10.5px;line-height:12.5px;font-weight:800;letter-spacing:.9px}
/* MoreRow: 56 high, 16 each side, 6 above and below; the button 44 high, radius 14, a step lighter than the page */
.mw{height:56px;padding:6px 16px;display:flex;flex-direction:column;justify-content:center}
.mo{height:44px;border-radius:14px;background:var(--pill);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14.5px;font-weight:800;letter-spacing:-.1px}
</style></head>
<body>
<div class="abs" id="list"></div>

<script src="icons.js"></script>
<script src="chrome.js"></script>
<script>
const S = readSeed();
if (!S) throw new Error('all-events.html needs a seed: python3 studio/list.py <events folder>');
const $ = (id) => document.getElementById(id);
// The list as a view of its own: the second word of the switch is "All events" and it is the view on screen.
const barFitted = chrome({ clock: S.clock, when: S.when, city: S.city, me: S.me, view: 'second', second: 'All events', sortDotted: S.sortDotted });

// ---- the rows (AllEventsRows.tsx) ----
function listing(r) {
  return `<div class="row" data-id="${r.id}"><div class="fly">${r.poster ? posterHTML(r.poster, 10) : r.cover ? `<img class="c" src="${r.cover}">` : '<div class="none"></div>'}
      ${r.play ? `<div class="play">${hugeicon('PlayIcon', 13, '#fff', 2, '#fff')}</div>` : ''}</div>
    <div class="bd"><div class="top"><div class="ti">${esc(r.title)}</div>${r.venue ? `<div class="ve">${esc(r.venue)}</div>` : ''}</div>
      <div class="wh"><div class="tm tnum">${esc(r.time)}</div>${r.series ? `<div class="se">${esc(r.series)}</div>` : ''}</div></div>
    <div class="sd">${r.price ? `<div class="pr tnum">${esc(r.price)}</div>` : ''}<div class="so">${esc(r.tag)}</div></div></div>`;
}
const more = (r) => `<div class="mw"><div class="mo"><span>${esc(r.label)}</span>${hugeicon('ArrowDown01Icon', 16, 'rgba(255,255,255,.55)', 2.4)}</div></div>`;
const list = $('list');
// One block per night, so its header stays pinned exactly while its night is on screen (SectionList's sticky headers).
list.innerHTML = S.sections.map((s) => `<section><div class="nh"><div class="t disp">${esc(s.title)}</div><div class="c tnum">${s.count}</div></div>${s.rows.map((r) => (r.kind === 'more' ? more(r) : listing(r))).join('')}</section>`).join('')
  + '<div style="height:98px"></div>'; // contentContainerStyle paddingBottom: listBottom (the tab bar's reserve)

// ---- what a scene can do ----
const maxScroll = () => Math.max(0, list.scrollHeight - list.clientHeight);
window.scrollList = (y) => { list.scrollTop = Math.max(0, Math.min(maxScroll(), y)); return list.scrollTop; };
window.maxScroll = maxScroll;
// Where to scroll so a listing stands `under` points below the top of the list (default: one row under the pinned header).
const rowOf = (id) => list.querySelector(`.row[data-id="${id}"]`);
window.rowY = (id, under = 56 + 96) => { const el = rowOf(id); if (!el) return null; return Math.max(0, Math.min(maxScroll(), el.offsetTop - under)); };
// A press on a row, 0 to 1: PressRow dips to 98.5% (SPRINGS.press), and nothing else changes.
window.press = (id, p) => { const el = rowOf(id); if (el) el.style.transform = `scale(${1 - 0.015 * Math.max(0, Math.min(1, p))})`; };

Promise.all([barFitted, document.fonts.ready]).then(() => { fitPosters(); window.scrollList(S.scrollY || 0); document.body.dataset.ready = '1'; });
</script>
</body></html>
