<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Notch;src:url(StackSansNotch-Bold.ttf)}

*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#000;color:#fff;font-family:Inter}

.shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%)}
.n{position:absolute;right:56px;bottom:52px;font-weight:700;font-size:30px;color:rgba(255,255,255,.6)}
</style></head><body>

 <div class="big" style="bottom:150px">2AM.<br><span style="color:#FFD60A">FLASH ON.</span></div><div class="sm" style="bottom:80px;font-size:40px;color:rgba(255,255,255,.85)">swipe for the before →</div><img class="tag" src="pxi-icon.png"></div>

 <div class="big" style="bottom:90px;color:#FFD60A">FLASH ON</div><div class="n">2/2</div></div>

 <div class="sm" style="top:70px;text-align:center;font-size:52px">and it's already in the party album</div>
 <img src="gallery-phone.png" style="position:absolute;left:270px;top:200px;width:540px"></div>

 <div style="position:absolute;left:0;right:0;top:810px;display:flex;justify-content:center;gap:28px">

</div>

window.READY=document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.decode().catch(()=>0))));</script>
</body></html>
