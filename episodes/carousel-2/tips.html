<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:900;src:url(Inter-Black.otf)}

*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#0A0A0A;color:#fff;font-family:Inter,"Noto Color Emoji"}
