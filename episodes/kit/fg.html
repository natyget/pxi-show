<script>
// variants: ?name=&venue=&date=&time=&until=&cover=&vis=
const Q=new URLSearchParams(location.search);
if(Q.get('name')){const map={"NIO'S BIRTHDAY":Q.get('name'),"NIO'S PLACE":Q.get('venue'),"SAT, NOV 21":Q.get('date'),"10 PM":Q.get('time'),"UNTIL 3 AM":Q.get('until'),"PRIVATE":Q.get('vis')||'PRIVATE'};
 const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const k=n.nodeValue.trim();if(map[k]!=null)n.nodeValue=map[k];}
 document.querySelectorAll('#sheet .photo').forEach(e=>{e.style.backgroundImage='url('+Q.get('cover')+')';e.style.imageRendering='auto'});}
</script>
<script>
// icons
document.querySelectorAll('[data-icon]').forEach(e=>{const s=+e.dataset.size;
  e.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none">'+ICONS[e.dataset.icon].replaceAll('currentColor',e.dataset.color)+'</svg>';});
// status bar and tab bar, on the 360 grid
function status(el){el.innerHTML='<div class="abs" style="left:50px;top:19px;font-weight:600;font-size:16px">9:41</div>'+
 '<svg class="abs" style="left:256px;top:22px" width="76" height="14" viewBox="0 0 76 14"><rect x="2" y="9" width="3" height="4" rx=".5" fill="#fff"/><rect x="7" y="7" width="3" height="6" rx=".5" fill="#fff"/><rect x="12" y="4" width="3" height="9" rx=".5" fill="#fff"/><rect x="17" y="2" width="3" height="11" rx=".5" fill="#fff"/>'+
 '<path d="M27 6.5a10 10 0 0 1 14 0M29.5 9a6 6 0 0 1 9 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="34" cy="11.5" r="1.5" fill="#fff"/>'+
 '<rect x="48.5" y="1.5" width="22" height="11" rx="3" stroke="rgba(255,255,255,.45)" fill="none"/><rect x="50.5" y="3.5" width="18" height="7" rx="1.5" fill="#fff"/><rect x="71.5" y="5" width="2" height="4" rx="1" fill="rgba(255,255,255,.45)"/></svg>';}
status(camst);status(galst);
function ic(n,s,c){return '<svg xmlns="http://www.w3.org/2000/svg" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none">'+ICONS[n].replaceAll('currentColor',c)+'</svg>'}
camtab.innerHTML='<div class="abs" style="left:76px;top:700px;width:208px;height:58px;border-radius:29px;background:#1A1A1A"></div>'+
 ['Home05Icon','Camera02Icon','Ticket01Icon'].map((n,i)=>'<div class="abs" style="left:'+(100+Math.round(i*69.6))+'px;top:718px">'+ic(n,22,i==1?'#fff':'rgba(255,255,255,.4)')+'</div>').join('');
// gallery tiles: your shots, then everyone else
const NOB='<svg width="22" height="22" viewBox="0 0 64 64"><rect width="64" height="64" fill="#111"/><circle cx="32" cy="24" r="12" fill="#2a2a2a"/><circle cx="32" cy="64" r="22" fill="#2a2a2a"/></svg>';
const T_=[ // [photo, zoom, x%, y%, emoji, count]
 ['shout',1,50,50,'🔥','156'],['laugh',1,50,40,'😍','124'],['door',1,50,50,'❤️','91'],
 ['girls',1,50,45,'🔥','90'],['sami',1,50,35,'🙌','83'],['asleep',1,50,60,'😭','77'],
 ['girls',2.1,25,30,'😍','71'],['door',2,50,30,'✌️','66'],['sami',2.2,50,18,'🔥','61'],
 ['asleep',2,72,45,'🫶','58'],['laugh',1.8,50,60,'✨','52'],['shout',2,48,25,'🙌','47'],
 ['door',2.2,20,60,'😂','44'],['girls',2,80,40,'🔥','39'],['asleep',2.2,25,40,'😴','36'],
 ['sami',2,50,70,'✨','31'],['door',2.4,80,35,'❤️','28'],['laugh',2.6,50,30,'😍','24']];
let h='';T_.forEach((t,i)=>{const mine=i<3;const r=mine?0:1+Math.floor((i-3)/3);const x=(i%3)*120;const y=mine?160:324+(r-1)*120;
 h+='<div class="abs" style="left:'+(x+2)+'px;top:'+(y+2)+'px;width:116px;height:116px;border-radius:13px;overflow:hidden">'+
   '<div class="photo" style="background-image:url('+t[0]+'.png);background-size:'+(t[1]*100)+'% auto;background-position:'+t[2]+'% '+t[3]+'%"></div></div>'+
   '<div class="abs" style="left:'+(x+9)+'px;top:'+(y+85)+'px;width:26px;height:26px;border-radius:50%;background:#1C1C1C;padding:2px"><div style="width:22px;height:22px;border-radius:50%;overflow:hidden">'+
   (mine?'<div style="width:22px;height:22px;background:url(laugh.png) 50% 28%/300% auto;image-rendering:pixelated"></div>':NOB)+'</div></div>'+
   '<div class="abs" style="right:'+(360-x-111)+'px;top:'+(y+96)+'px;height:15px;border-radius:7.5px;background:rgba(0,0,0,.62);display:flex;align-items:center;padding:0 6px;gap:2px;font-size:9px;font-weight:800"><span style="font-size:10px">'+t[4]+'</span>'+t[5]+'</div>';});
h+='<div class="abs" style="left:15px;top:300px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.55)">Everyone else</div>';
galscroll.innerHTML=h;

// ---- the timeline (seconds)
const CAPS=[[0.15,2.3,"friendsgiving at zoe's",1500],[2.3,4.6,"everyone's taking pics",1500],[4.6,7.9,"next day: you're in none of them",1500],
 [7.9,11.7,"so now every pic goes to one album",62],[11.7,15.0,"one tap and you're in",62],[15.0,18.4,"even the ones you're actually in",62]];
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3), cl=x=>Math.max(0,Math.min(1,x)), lin=(t,a,b)=>cl((t-a)/(b-a));
function show(id){['party','stage','end'].forEach(s=>document.getElementById(s).style.display=s==id?'block':'none')}
function T(t){
  // captions
  const c=CAPS.find(c=>t>=c[0]&&t<c[1]);
  if(c){captext.textContent=c[2];cap.style.top=c[3]+'px';cap.style.opacity=Math.min(lin(t,c[0],c[0]+.12),1-lin(t,c[1]-.1,c[1]));
    cap.style.transform='translateY('+(1-ease(lin(t,c[0],c[0]+.2)))*18+'px)';} else cap.style.opacity=0;
  if(t<7.9){ show('party');
    // the party: the door, then three photos as flashes go off, then the morning after
    let src='door',z=1.04+0.06*lin(t,0,2.3),ox=0;
    if(t>=2.3&&t<4.6){const k=Math.floor((t-2.3)/0.77);src=['sami','girls','laugh'][Math.min(k,2)];z=1.1-0.04*lin(t,2.3+k*.77,2.3+(k+1)*.77)}
    if(t>=4.6){src='asleep';z=1.0+0.08*lin(t,4.6,7.9)}
    p1.style.backgroundImage='url('+src+'.png)';p1.style.transform='scale('+z+')';
    let f=0;[2.3,3.07,3.84].forEach(ft=>{if(t>=ft&&t<ft+.3)f=Math.max(f,.9*(1-(t-ft)/.3))});pflash.style.opacity=f;
    return;}
  if(t>=18.4){ show('end');
    const k=ease(lin(t,18.4,18.9));endicon.style.transform='scale('+(0.8+0.2*k)+')';endicon.style.opacity=k;
    endline.style.opacity=ease(lin(t,18.6,19.0));endsub.style.opacity=ease(lin(t,18.9,19.3));return;}
  show('stage');
  phone.style.transform='translateY('+(1-ease(lin(t,7.9,8.35)))*140+'px)';
  const inCam=t<11.7; cam.style.display=inCam?'block':'none';
  // camera: the viewfinder drifts, the shutter is pressed at 9.4, the print swaps to the new shot
  vf.style.transform='scale('+(1.06+0.02*Math.sin(t*1.3))+') translate('+Math.sin(t*0.9)*3+'px,'+Math.cos(t*1.1)*2+'px)';
  const press=lin(t,9.3,9.4)-lin(t,9.45,9.6);shutter.style.transform='scale('+(1-0.12*press)+')';
  camflash.style.opacity=t>=9.42&&t<9.75?0.85*(1-(t-9.42)/.33):0;
  thumb.style.backgroundImage=t>=9.5?'url(shout.png)':'url(girls.png)';
  thumb.parentElement.style.transform='scale('+(t>=9.5?1+0.25*(1-ease(lin(t,9.5,9.8))):1)+')';
  // the event view rises over the gallery, scrolls a little, OPEN ALBUM is tapped
  gal.style.display=t>=11.7?'block':'none';
  const up=ease(lin(t,11.7,12.15)), down=ease(lin(t,14.6,15.0));
  sheet.style.transform='translateY('+((1-up)+down)*800+'px)';
  dim.style.opacity=t<15?0.6*up:0.6*(1-down);
  body.style.transform='translateY('+(-118*ease(lin(t,12.7,13.6)))+'px)';
  openpill.style.transform='scale('+(1-0.05*(lin(t,14.25,14.35)-lin(t,14.4,14.5)))+')';
  galscroll.style.transform='translateY('+(-170*ease(lin(t,15.5,18.3)))+'px)';
  // touches
